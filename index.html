<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votación Mercosur 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@500;700;800&display=swap');
:root{--bg:#07090d;--panel:#10151d;--line:#232c3a;--ink:#f3efe6;--mut:#97a1ae;--gold:#e9b44c;--a:#2ec4b6;--b:#e9b44c;--c:#e4572e;--serif:"Fraunces",Georgia,serif;--sans:"Inter","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#1a1508 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:28px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.kick{font:800 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:28px;height:2px;background:var(--gold)}
h1{font:800 clamp(28px,8vw,40px)/1.1 var(--serif);letter-spacing:-.02em;margin:0}
.ctx{font-size:16px;line-height:1.5;color:var(--mut);margin:0}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:18px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font:700 20px/1.25 var(--sans);text-align:left;cursor:pointer;transition:transform .15s,border-color .2s;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.98)}.opt:hover{border-color:var(--c1)}.opt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.opt[disabled]{opacity:.5;cursor:wait}
.opt .lt{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 22px var(--sans);color:var(--bg);background:var(--c1)}
.note{font-size:14px;color:var(--mut);text-align:center;margin:0}
.err{font-size:15px;color:#ffb8a3;text-align:center;margin:0}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 20px;border-radius:22px;background:var(--panel);border:2px solid var(--c1)}
.chk{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--c1);color:var(--bg);font:800 44px var(--sans);animation:pop .5s cubic-bezier(.3,1.7,.4,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.done h2{font:800 26px/1.15 var(--serif);margin:0}.done p{margin:0;font-size:16px;line-height:1.5;color:var(--mut)}.done b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.chk{animation:none}}
</style>
</head>
<body>
<main>
  <div class="kick">Encuesta en vivo · Mercosur 2026</div>
  <h1>Rodrigo Paz quitó el subsidio a los combustibles. ¿Tú lo habrías hecho?</h1>
  <p class="ctx">Bolivia gastaba unos USD 2.600 millones al año en subsidiar el diésel. Elige una opción: tu voto aparece en la pantalla del salón.</p>
  <div id="app"></div>
</main>
<script>
(function(){
  var TOPIC='mercosur-fujc-3c0b851b39';
  var OPTS=[{k:'A',t:'Sí, de golpe',c:'var(--a)'},{k:'B',t:'Sí, pero gradual',c:'var(--b)'},{k:'C',t:'No, lo mantendría',c:'var(--c)'}];
  var LOCK_MS=2*60*60*1000, KEY='mcs-voto-'+TOPIC;
  function get(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Date.now()-v.t<LOCK_MS)return v;}catch(e){}return null;}
  function set(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}}
  function dev(){var id=null;try{id=localStorage.getItem('mcs-dev');}catch(e){}
    if(!id){id=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);try{localStorage.setItem('mcs-dev',id);}catch(e){}}return id;}
  var app=document.getElementById('app'), id=dev(), busy=false;
  function render(msg){
    var v=get();
    if(v){var o=OPTS.filter(function(x){return x.k===v.k})[0]||OPTS[0];
      app.innerHTML='<div class="done" style="--c1:'+o.c+'"><div class="chk">✓</div><h2>Tu voto quedó registrado</h2><p>Votaste <b>'+o.k+' · '+o.t+'</b>.</p><p>Solo se permite un voto por celular.</p></div>';return;}
    app.innerHTML='<div class="opts">'+OPTS.map(function(o){return '<button class="opt" id="opt-'+o.k+'" style="--c1:'+o.c+'"><span class="lt">'+o.k+'</span><span>'+o.t+'</span></button>';}).join('')+'</div>'+(msg?'<p class="err">'+msg+'</p>':'')+'<p class="note">Un voto por celular. No se puede cambiar después.</p>';
    OPTS.forEach(function(o){document.getElementById('opt-'+o.k).addEventListener('click',function(){vote(o.k);});});
  }
  function vote(k){
    if(busy||get())return render();busy=true;
    [].forEach.call(document.querySelectorAll('.opt'),function(b){b.disabled=true;});
    fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:k+'-'+id}).then(function(r){
      if(!r.ok)throw new Error(r.status);set({k:k,t:Date.now()});busy=false;render();
    }).catch(function(){busy=false;render('No se pudo enviar el voto. Revisa tu conexión e inténtalo de nuevo.');});
  }
  render();
})();
</script>
</body>
</html>
